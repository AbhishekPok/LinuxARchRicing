# ─── hyprlock (v0.9) ── caelestia-style lock ───
# Layout follows caelestia-dots/shell modules/lock: one rounded panel over the
# blurred wallpaper, three columns (weather/fetch/media | clock/profile/password
# | resources/notifications). Colours come from the active theme-manager theme:
# lock.sh writes ~/.cache/hyprlock/colors.conf right before hyprlock starts.
# Card text is pango markup from scripts/lock-info.sh.
# Previous design: hyprlock.conf.bak.2026-10-27-caelestia

source = /home/abhishek/.cache/hyprlock/colors.conf

$font   = JetBrainsMono Nerd Font
$info   = /home/abhishek/.config/hypr/scripts/lock-info.sh
# column centres and card width; the layout fits a 1600x1000 logical screen
$left   = -520
$right  = 520
$cardw  = 400

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1500
}

# caelestia's motion: emphasized-decelerate in, standard-accelerate out
animations {
    enabled = true
    bezier = emphDecel, 0.05, 0.7, 0.1, 1
    bezier = stdAccel, 0.3, 0, 1, 1
    bezier = standard, 0.2, 0, 0, 1
    animation = fadeIn, 1, 5, emphDecel
    animation = fadeOut, 1, 3, stdAccel
    animation = inputFieldDots, 1, 2, standard
    animation = inputFieldColors, 1, 4, standard
    animation = inputFieldFade, 1, 3, standard
}

background {
    monitor =
    # symlink kept on the current wallpaper by wallpaper-picker.sh
    path = /home/abhishek/.config/hypr/lock-bg
    color = $bg
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.18
}

# ─── panel ───
shape {
    monitor =
    size = 1500, 880
    rounding = 36
    color = $panel
    border_size = 1
    border_color = $outline
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
    shadow_passes = 3
    shadow_size = 18
    shadow_color = rgba(00000088)
}

# ─── left column ───
shape {
    monitor =
    size = $cardw, 170
    rounding = 24
    color = $card
    position = $left, 255
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] $info weather
    font_size = 15
    font_family = $font
    color = $fg
    text_align = left
    position = $left, 255
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = $cardw, 300
    rounding = 24
    color = $card
    position = $left, 10
    halign = center
    valign = center
    zindex = 1
}

# terminal chip, as in caelestia's fetch card
shape {
    monitor =
    size = 34, 34
    rounding = 10
    color = $primary
    position = -685, 125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <b>&gt;</b>
    font_size = 15
    font_family = $font
    color = $bg
    position = -685, 125
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = fetch.sh
    font_size = 13
    font_family = $font
    color = $dim
    position = -615, 125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] $info fetch
    font_size = 13
    font_family = $font
    color = $fg
    text_align = left
    position = $left, -15
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = $cardw, 190
    rounding = 24
    color = $card
    position = $left, -255
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:2000] $info media
    font_size = 14
    font_family = $font
    color = $fg
    text_align = left
    position = $left, -255
    halign = center
    valign = center
    zindex = 2
}

# ─── centre column ───
label {
    monitor =
    text = cmd[update:60000] $info date
    font_size = 15
    font_family = $font SemiBold
    color = $fg
    position = 0, 355
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] $info clock
    font_size = 132
    font_family = $font ExtraBold
    color = $primary
    position = 0, 225
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] $info greeting
    font_size = 16
    font_family = $font
    color = $dim
    position = 0, 105
    halign = center
    valign = center
    zindex = 2
}

# profile: caelestia draws a person glyph in a filled shape
shape {
    monitor =
    size = 128, 128
    rounding = -1
    color = $card
    border_size = 2
    border_color = $outline
    position = 0, -5
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = 󰀄
    font_size = 54
    font_family = $font
    color = $primary
    position = 0, -5
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 380, 58
    rounding = -1
    outline_thickness = 2
    outer_color = $outline
    inner_color = $card
    font_color = $fg
    font_family = $font
    check_color = $primary
    fail_color = $error
    capslock_color = $warn
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    fail_text = <b>$FAIL</b>  ($ATTEMPTS)
    position = 0, -135
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    font_size = 11
    font_family = $font
    color = $dim
    position = 0, -195
    halign = center
    valign = center
    zindex = 2
}

# ─── right column ───
shape {
    monitor =
    size = $cardw, 260
    rounding = 24
    color = $card
    position = $right, 230
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:3000] $info resources
    font_size = 14
    font_family = $font
    color = $fg
    text_align = left
    position = $right, 230
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = $cardw, 440
    rounding = 24
    color = $card
    position = $right, -130
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:5000] $info notifications
    font_size = 13
    font_family = $font
    color = $fg
    text_align = left
    position = $right, -130
    halign = center
    valign = center
    zindex = 2
}
