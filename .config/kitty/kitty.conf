# ══════════════════════════════════════════════════════════
#  FONT
# ══════════════════════════════════════════════════════════
font_family              JetBrainsMono Nerd Font
font_size                11
bold_font                auto
italic_font              auto

# ══════════════════════════════════════════════════════════
#  CURSOR / SCROLLBACK / MOUSE
# ══════════════════════════════════════════════════════════
cursor_shape             block
cursor_blink_interval    0.5
scrollback_lines         100000
copy_on_select           yes
mouse_hide_wait          3.0
detect_urls              yes
focus_follows_mouse      yes

# ══════════════════════════════════════════════════════════
#  WINDOW
# ══════════════════════════════════════════════════════════
window_padding_width     4
# Pin the text grid to the top. The default (center) splits the leftover
# pixels above and below, which looks like a blank line under the tab bar.
placement_strategy       top-left
hide_window_decorations  yes

# RISK: 0 means closing the OS window silently kills every tab and
# every running command in them. With tabs enabled, consider `1`.
confirm_os_window_close   1

# ══════════════════════════════════════════════════════════
#  COLORS
# ══════════════════════════════════════════════════════════
# Colors live in kali.conf (Kali neon palette, shared with the desktop).
include kali.conf


# ══════════════════════════════════════════════════════════
#  TAB BAR
# ══════════════════════════════════════════════════════════
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_align            left
tab_bar_min_tabs         1
tab_bar_margin_width     0.0
tab_bar_margin_height    0.0 0.0
tab_title_max_length     24
tab_activity_symbol      ●
bell_on_tab              "● "

# {title} honours a manual rename; falls back to the running process
tab_title_template        "{index}: {title}{' +' if num_windows > 1 else ''}"
active_tab_title_template "{index}: {title}{' +' if num_windows > 1 else ''}"

# Tab colors are set in kali.conf: active = neon green, inactive = the
# terminal background, so inactive tabs blend into the window.
active_tab_font_style    bold
inactive_tab_font_style  normal
# tab_bar_background left UNSET on purpose — see note below.

# ══════════════════════════════════════════════════════════
#  TAB KEYBINDS
# ══════════════════════════════════════════════════════════
map ctrl+shift+t         new_tab_with_cwd
map ctrl+shift+q         close_tab
map ctrl+alt+r           set_tab_title
map ctrl+shift+alt+t     set_tab_title

map ctrl+shift+right     next_tab
map ctrl+shift+left      previous_tab
map ctrl+shift+.         move_tab_forward
map ctrl+shift+,         move_tab_backward

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map ctrl+shift+enter     no_op

# ══════════════════════════════════════════════════════════
#  REMOTE CONTROL (scripted tab titles)
# ══════════════════════════════════════════════════════════
allow_remote_control     socket-only
listen_on                unix:@mykitty-{kitty_pid}

# Uncomment ONLY if your zsh prompt keeps overwriting manual tab names:
# shell_integration no-title
shell_integration no-title

# Cursor trail effect
cursor_trail 3

# theme-manager (generated)
include themes/active.conf
