# Kali neon palette, shared with waybar, swaync, wlogout, the dock, rofi,
# hyprlock and the window borders: black ground, #00ff99 primary, #00e5ff
# secondary. The previous Kali-Dark (qterminal) palette is kept in
# kali.conf.bak.* if you want the stock Kali look back.

background               #000000
foreground               #ffffff
cursor                   #00ff99
cursor_text_color        #000000
selection_background     #003d24
selection_foreground     #ffffff
url_color                #00e5ff
background_opacity       0.85

# black
color0   #000000
color8   #4d4d4d
# red
color1   #ff3e3e
color9   #ff5555
# green
color2   #2dff00
color10  #50fa7b
# yellow
color3   #f0ff00
color11  #f1fa8c
# blue
color4   #2979ff
color12  #5c95ff
# magenta
color5   #bc51ff
color13  #d68fff
# cyan
color6   #00e5ff
color14  #55ffff
# white
color7   #d0d0d0
color15  #ffffff

# Tab bar in the neon accent
active_tab_foreground    #000000
active_tab_background    #00ff99
inactive_tab_foreground  #4d4d4d
inactive_tab_background  #000000
