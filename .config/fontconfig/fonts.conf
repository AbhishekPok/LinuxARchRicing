<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font preference order ported from adrsha/nix-dots modules/fonts/fonts.nix
     (fontconfig.defaultFonts). Dank Mono is deliberately absent: it is a
     commercial font that the source repo bundles, so it is not installed here.
     GeistMono is that repo's own first choice anyway. -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>GeistMono Nerd Font</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Material Symbols Outlined</family>
      <family>Iosevka Nerd Font</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Sans Devanagari</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans Devanagari</family>
    </prefer>
  </alias>
  <!-- The amane shell asks for Inter, which is not installed here. Adwaita
       Sans is derived from Inter, so it stands in cleanly. This is a <prefer>,
       so installing inter-font later makes the real family win automatically. -->
  <alias>
    <family>Inter</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
</fontconfig>
